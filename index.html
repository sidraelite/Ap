<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus Industrial CIU</title>
    <link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">
    <script src="https://checkout.flutterwave.com/v3.js"></script>
    <style>
        :root { --case: #d1d5db; --lcd: #a3b18a; --btn: #1e293b; --green: #22c55e; --red: #ef4444; }
        * { box-sizing: border-box; outline: none; }
        body { background: #000; display: flex; align-items: center; justify-content: center; height: 100dvh; margin: 0; font-family: sans-serif; }
        .ciu { width: 95%; max-width: 380px; height: 95dvh; background: var(--case); border-radius: 40px; padding: 25px; border-bottom: 15px solid #64748b; position: relative; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 30px 60px rgba(0,0,0,0.8); }
        .leds { position: absolute; top: 20px; left: 40px; display: flex; gap: 15px; }
        .led { width: 12px; height: 12px; border-radius: 50%; background: #94a3b8; border: 1px solid #475569; }
        .led.active { animation: blink 0.8s infinite; }
        .led.pwr { background: var(--green); box-shadow: 0 0 10px var(--green); }
        .led.comm { background: #eab308; }
        .lcd { background: var(--lcd); height: 25%; border: 8px solid #1e293b; border-radius: 15px; padding: 15px; display: flex; flex-direction: column; box-shadow: inset 0 5px 15px rgba(0,0,0,0.4); }
        .lcd-main { font-family: 'Digital-7 Mono', sans-serif; font-size: 60px; color: #1b2e25; text-align: right; margin-top: auto; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; flex-grow: 1; }
        .key { background: var(--btn); color: white; border: none; border-radius: 18px; font-size: 28px; font-weight: bold; box-shadow: 0 6px #000; cursor: pointer; }
        .key:active { transform: translateY(3px); box-shadow: 0 2px #000; }
        .vend-box { background: #0f172a; padding: 15px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px; }
        .f-in { width: 100%; height: 45px; border-radius: 10px; border: none; text-align: center; font-weight: 900; font-size: 18px; }
        .btn-act { width: 100%; height: 50px; background: #eab308; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; }
        #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); display: none; padding: 40px; color: #fff; z-index: 99; text-align: center; }
        @keyframes blink { 50% { opacity: 0.1; } }
    </style>
</head>
<body>

<div class="ciu">
    <div class="leds">
        <div class="led pwr active"></div>
        <div class="led comm" id="l_comm"></div>
    </div>
    <div class="lcd">
        <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:900;"><span>YEDC GRID</span><span id="l_msg">READY</span></div>
        <div class="lcd-main" id="l_val">0.00</div>
    </div>
    <div class="keypad">
        <button class="key" onclick="k('1')">1</button><button class="key" onclick="k('2')">2</button><button class="key" onclick="k('3')">3</button>
        <button class="key" onclick="k('4')">4</button><button class="key" onclick="k('5')">5</button><button class="key" onclick="k('6')">6</button>
        <button class="key" onclick="k('7')">7</button><button class="key" onclick="k('8')">8</button><button class="key" onclick="k('9')">9</button>
        <button class="key" style="background:var(--red)" onclick="c()">C</button><button class="key" onclick="k('0')">0</button><button class="key" style="background:var(--green)" onclick="enter()">↵</button>
    </div>
    <div class="vend-box">
        <input type="number" id="m_id" class="f-in" placeholder="METER ID">
        <button class="btn-act" id="s_btn" onclick="sync()" style="background:#475569; color:#fff;">LINK CIU</button>
        <div id="buy_ui" style="display:none">
            <input type="number" id="amt" class="f-in" placeholder="AMOUNT (₦)">
            <button class="btn-act" onclick="pay()">GENERATE TOKEN</button>
        </div>
    </div>
</div>

<div id="modal">
    <div id="receipt" style="background:white; color:black; padding:25px; border-radius:15px; text-align:left; font-family:monospace;"></div>
    <button class="btn-act" style="margin-top:20px" onclick="location.reload()">BACK</button>
</div>

<script>
    let buf = ""; let vM = ""; let loop = 0;
    const API = "https://script.google.com/macros/s/AKfycbwE-EuDn4MOPK0qZTZ8fK5Y8TXZ_1VmpMH5-y1iHoYwnZW9jnUptfQzA086dUEImpEs/exec"; 
    const PUB = "FLWPUBK_LIVE_xxxxxxxxxxxx";

    function k(v) { buf += v; document.getElementById('l_val').innerText = buf; }
    function c() { buf = ""; document.getElementById('l_val').innerText = "0.00"; }

    async function sync() {
        const m = document.getElementById('m_id').value || buf;
        if(m.length < 10) return;
        document.getElementById('l_comm').classList.add('active');
        try {
            const r = await (await fetch(`${API}?meter=${m}&monitor=true`)).json();
            if(r.status === "success") {
                vM = m; document.getElementById('buy_ui').style.display = 'block';
                document.getElementById('s_btn').style.display = 'none';
                setInterval(() => {
                    const info = [{v: r.voltage, m: "VOLTS"}, {v: r.amp, m: "AMPS"}, {v: "---", m: r.name.substring(0,12)}];
                    let s = info[loop % 3];
                    document.getElementById('l_val').innerText = s.v;
                    document.getElementById('l_msg').innerText = s.m;
                    loop++;
                }, 4000);
            }
        } catch(e) { document.getElementById('l_msg').innerText = "ERROR"; }
        document.getElementById('l_comm').classList.remove('active');
    }

    async function enter() {
        if(!vM || !buf) return;
        document.getElementById('l_comm').classList.add('active');
        const r = await (await fetch(`${API}?meter=${vM}&code=${buf}`)).json();
        document.getElementById('l_val').innerText = r.val;
        document.getElementById('l_msg').innerText = r.msg;
        buf = ""; document.getElementById('l_comm').classList.remove('active');
    }

    function pay() {
        const a = document.getElementById('amt').value;
        FlutterwaveCheckout({
            public_key: PUB, tx_ref: "NX"+Date.now(), amount: parseInt(a)+100, currency: "NGN",
            callback: async (r) => {
                const res = await (await fetch(`${API}?verify_ref=${r.transaction_id}&amt=${a}&meter=${vM}`)).json();
                if(res.status === "success") {
                    document.getElementById('receipt').innerHTML = `<h3>YEDC VOUCHER</h3><hr>TOKEN: ${res.token}<br>UNITS: ${res.units}kWh<br>METER: ${vM}<br>DATE: ${res.date}<hr>PROFIT: ₦100.00`;
                    document.getElementById('modal').style.display = 'block';
                }
            }
        });
    }
</script>
</body>
</html>
